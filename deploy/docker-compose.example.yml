# An example deployment: nginx serving the site and proxying /quantum/ to the BEAM service, plain HTTP on 8100.
# Put TLS in front of it (a reverse proxy or a CDN) for a public site.
name: quanterall
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8100:80"
    volumes:
      - ./nginx.example.conf:/etc/nginx/conf.d/default.conf:ro
      - ../site:/var/www/quanterall:ro
    depends_on:
      quantum:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

  # the quantum demo API on the BEAM (Elixir/Erlang, Nova): /quantum/ and /health
  quantum:
    build:
      context: ../quanterall_quantum
    expose:
      - "8080"
    environment:
      - PORT=8080
      - MIX_ENV=prod
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # optional: the Python engine's API (qsim/), not routed by the example nginx
  qsim:
    build:
      context: ../qsim
      target: run
    expose:
      - "8000"
    environment:
      - QSIM_MAX_CONCURRENT=4
      - QSIM_TIMEOUT_S=30
    restart: unless-stopped
    mem_limit: 2g
    read_only: true
    tmpfs:
      - /tmp
