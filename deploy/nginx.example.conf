# An example nginx configuration: the static site (site/) and the quantum API (/quantum/ -> the BEAM service),
# rate-limited per visitor. Used by deploy/docker-compose.example.yml.


# per visitor: 5 simulations a second, bursts of 20; beyond that 429
limit_req_zone $binary_remote_addr zone=qsim:10m rate=5r/s;
limit_req_status 429;

# caching, by path, set once at the server level: an add_header inside a location would drop the security headers.
# Pages are asked for again on every visit; the script, style and image names carry no content hash, so scripts
# and styles are re-checked hourly and fonts and images daily; the simulations are never cached.
map $uri $q_cache {
    ~^/quantum/                                  "no-store, no-cache, must-revalidate";
    ~*\.(css|js)$                                "public, max-age=3600, must-revalidate";
    ~*\.(woff2?|ttf|eot|ico|svg|png|jpg|webp)$   "public, max-age=86400";
    default                                      "no-cache";
}

server {
    listen 80;
    server_name _;

    # behind a reverse proxy or CDN: trust its address for the visitor's real IP (rate limits per visitor)
    # set_real_ip_from <your proxy address>;
    # real_ip_header   X-Forwarded-For;



    # Security headers (HSTS without includeSubDomains: other *.quanterall.com hosts are not ours to force)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options            SAMEORIGIN                always;
    add_header X-Content-Type-Options     nosniff                   always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Cache-Control              $q_cache                  always;
    server_tokens off;

    root  /var/www/quanterall;
    index index.html;

    # unknown paths: a real 404 (every path used to return the homepage with 200)
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
        access_log off;
    }

    # Quantum demo API -> the BEAM/Nova container
    location /quantum/ {
        limit_req          zone=qsim burst=20 nodelay;
        proxy_pass         http://quantum:8080/quantum/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Quantum demo UI (static; it calls /quantum/...)
    location = /demos {
        try_files /demos/index.html =404;
    }

    location = /health {
        proxy_pass http://quantum:8080/health;
    }

    location ~ /\. {
        deny all;
    }
}
