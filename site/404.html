<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Quanterall</title>
<style>
  :root { --bg:#0c1220; --white:#f2f4f8; --off:#aab4c6; --blue:#6ab0ff; --amber:#f5c842; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);
         color:var(--off); font-family:system-ui,-apple-system,'Segoe UI',sans-serif; padding:24px; box-sizing:border-box; }
  main { max-width:620px; }
  .code { font-family:Georgia,'Times New Roman',serif; font-size:clamp(72px,14vw,140px); color:var(--white); font-weight:300; line-height:1; }
  .tag { font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; color:var(--amber); letter-spacing:3px; text-transform:uppercase; margin:18px 0; }
  p { font-size:17px; line-height:1.7; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { text-decoration:underline; }
  nav a { margin-right:18px; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <div class="tag">// Not found</div>
  <p>This page does not exist — which is a change, because until recently every URL on this site returned the homepage.</p>
  <p><nav aria-label="Where to go"><a href="/#research">Research</a><a href="/demos">Quantum demos</a><a href="/#pivot">What we do</a><a href="/#legacy">Foundation</a></nav></p>
